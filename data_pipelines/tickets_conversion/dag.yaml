dag:
  dag_id: "tickets_conversion"
  schedule_interval: "0 3 * * *"
  description: "Portfolio-safe pipeline that links service interactions to converted orders using generic sources."
  default_args:
    owner: "vitor.faccin@portfolio.local"
    business: ["conversion", "portfolio"]
    start_date: "2026-04-01 00:00:00"
  tags:
    - "tickets_conversion"
    - "conversion"
    - "portfolio"
    - "service"
tasks:
  run_tickets_conversion:
    operator: "PythonOperator"
    file: "main.py"
    op_kwargs: {}
execution:
  - "run_tickets_conversion"

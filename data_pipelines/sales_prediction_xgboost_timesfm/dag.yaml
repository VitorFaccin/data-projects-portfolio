    business: ["forecasting", "portfolio"]
    start_date: "2026-04-01 00:00:00"
  tags:
    - "sales_prediction_xgboost_timesfm"
    - "forecasting"
    - "portfolio"
    - "timesfm"
    - "xgboost"
tasks:
  run_sales_prediction_xgboost_timesfm:
    operator: "PythonOperator"
    file: "main.py"
    op_kwargs: {}
execution:
  - "run_sales_prediction_xgboost_timesfm"
